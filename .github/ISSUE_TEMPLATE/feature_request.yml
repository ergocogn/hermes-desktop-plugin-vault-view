name: Feature request
description: Suggest an improvement to Vault View
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Please describe the user need without including private vault or client data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

